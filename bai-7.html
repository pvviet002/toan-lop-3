<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bài 7: Ôn tập hình học và đo lường - Toán lớp 3</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<style>
body { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; background-color: #ecfdf5; }
.btn-press:active:not(:disabled){ transform: scale(0.96); }
.shake { animation: shk .4s; }
@keyframes shk { 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
.pop { animation: pp .3s ease; }
@keyframes pp { 0%{transform:scale(.85);opacity:.4} 100%{transform:scale(1);opacity:1} }
</style>
</head>
<body class="p-3 md:p-6 min-h-screen flex flex-col">
<div class="max-w-3xl mx-auto w-full mb-3 flex justify-between items-center">
  <div class="flex gap-2">
    <a href="index.html" class="bg-white text-slate-600 px-3 py-2 rounded-xl shadow-sm border border-slate-200 hover:bg-slate-50 btn-press font-semibold text-sm">🏠 Sảnh chính</a>
    <button onclick="toggleFull()" class="bg-white text-slate-600 px-3 py-2 rounded-xl shadow-sm border border-slate-200 hover:bg-slate-50 btn-press font-semibold text-sm">🔲 Phóng to</button>
  </div>
  <div class="bg-white px-4 py-2 rounded-xl shadow-sm border border-slate-200 flex items-center gap-4 font-bold">
    <span class="text-amber-500">⭐ <span id="score">0</span></span>
    <span class="text-orange-500">🔥 <span id="streak">0</span></span>
  </div>
</div>
<div class="max-w-3xl mx-auto w-full bg-white rounded-3xl shadow-xl border border-emerald-100 overflow-hidden flex-grow flex flex-col">
  <div class="bg-gradient-to-r from-emerald-500 to-teal-600 text-white p-4 md:p-5 text-center">
    <h1 class="text-xl md:text-3xl font-extrabold tracking-wide">Bài 7: Ôn Tập Hình Học và Đo Lường 📐</h1>
    <p class="text-emerald-100 text-sm md:text-base mt-1">Bé chọn một dạng bài rồi luyện tập nhé!</p>
  </div>
  <div id="tabs" class="flex flex-wrap bg-slate-100 border-b border-slate-200"></div>
  <div class="p-4 md:p-6 flex-grow flex flex-col items-center justify-center">
    <div id="card" class="w-full max-w-xl bg-emerald-50 border-2 border-emerald-100 rounded-2xl p-5 md:p-6 text-center pop">
      <div id="qhtml" class="text-lg md:text-xl font-bold text-slate-700 mb-4 leading-relaxed"></div>
      <div id="answerArea"></div>
      <div id="feedback" class="mt-3 font-bold" style="min-height:1.6rem"></div>
    </div>
    <button onclick="nextQ()" class="mt-4 px-5 py-2.5 bg-slate-100 text-slate-600 font-bold rounded-xl border border-slate-200 hover:bg-slate-200 btn-press text-sm">Câu khác 🔄</button>
  </div>
</div>
<script>
var score=0, streak=0, cur=null, topic=0;
function rnd(a,b){ return Math.floor(Math.random()*(b-a+1))+a; }
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; } return a; }
function upd(){ document.getElementById('score').innerText=score; document.getElementById('streak').innerText=streak; }
function clockSVG(h,m){
  var s='<svg width="150" height="150" viewBox="0 0 140 140">';
  s+='<circle cx="70" cy="70" r="66" fill="#fff" stroke="#f59e0b" stroke-width="5"/>';
  for(var n=1;n<=12;n++){ var a=(n/12)*2*Math.PI-Math.PI/2; s+='<text x="'+(70+52*Math.cos(a)).toFixed(1)+'" y="'+(70+52*Math.sin(a)+5).toFixed(1)+'" font-size="13" font-weight="bold" text-anchor="middle" fill="#334155">'+n+'</text>'; }
  var ha=(((h%12)+m/60)/12)*2*Math.PI-Math.PI/2; s+='<line x1="70" y1="70" x2="'+(70+30*Math.cos(ha)).toFixed(1)+'" y2="'+(70+30*Math.sin(ha)).toFixed(1)+'" stroke="#1e293b" stroke-width="5" stroke-linecap="round"/>';
  var ma=(m/60)*2*Math.PI-Math.PI/2; s+='<line x1="70" y1="70" x2="'+(70+45*Math.cos(ma)).toFixed(1)+'" y2="'+(70+45*Math.sin(ma)).toFixed(1)+'" stroke="#3b82f6" stroke-width="3" stroke-linecap="round"/>';
  s+='<circle cx="70" cy="70" r="4" fill="#ef4444"/></svg>'; return s;
}
function readTime(h,m){ var s=h+' giờ'; if(m>0) s+=' '+m+' phút'; return s; }
function polySVG(pts,labels){
  var s='<svg width="330" height="150" viewBox="0 0 330 150">';
  var d=pts.map(function(p){return p[0]+','+p[1];}).join(' ');
  s+='<polyline points="'+d+'" fill="none" stroke="#0ea5e9" stroke-width="4" stroke-linejoin="round"/>';
  var nm=['A','B','C','D'];
  pts.forEach(function(p,i){ s+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="4" fill="#0369a1"/><text x="'+p[0]+'" y="'+(p[1]-9)+'" font-size="14" font-weight="bold" text-anchor="middle" fill="#0369a1">'+nm[i]+'</text>'; });
  for(var i=0;i<labels.length;i++){ var mx=(pts[i][0]+pts[i+1][0])/2, my=(pts[i][1]+pts[i+1][1])/2; s+='<text x="'+mx+'" y="'+(my+18)+'" font-size="13" text-anchor="middle" fill="#334155">'+labels[i]+' cm</text>'; }
  s+='</svg>'; return s;
}
var WD=['Chủ nhật','Thứ Hai','Thứ Ba','Thứ Tư','Thứ Năm','Thứ Sáu','Thứ Bảy'];
var OBJ=[['🎲','Xúc xắc',0],['🧊','Viên đá',0],['📦','Hộp quà',1],['📚','Chồng sách',1],['🧱','Viên gạch',1],['🥫','Lon nước',2],['🛢️','Thùng phi',2],['🥁','Cái trống',2],['⚽','Quả bóng',3],['🌍','Quả địa cầu',3],['🎱','Bi-a',3]];
var KHOI=['Khối lập phương','Khối hộp chữ nhật','Khối trụ','Khối cầu'];
var TOPICS = [
 {name:'Hình khối', make:function(){
   var o=pick(OBJ);
   return {type:'mcq', q:'<div class="text-7xl mb-1">'+o[0]+'</div><div class="text-slate-500 text-base mb-2">('+o[1]+')</div><div>Vật này có dạng khối gì?</div>', choices:KHOI.slice(), correct:o[2]};
 }},
 {name:'Đường gấp khúc', make:function(){
   var three=Math.random()<0.5;
   if(three){ var a=rnd(2,9)*10,b=rnd(2,9)*10,c=rnd(2,9)*10; var pts=[[25,55],[125,100],[210,50],[305,95]];
     return {type:'num', q: '<div class="flex justify-center mb-1">'+polySVG(pts,[a,b,c])+'</div><div>Tính độ dài đường gấp khúc ABCD.</div>', ans:a+b+c, unit:'cm'}; }
   var a=rnd(3,12)*10,b=rnd(3,12)*10; var pts=[[35,60],[165,105],[295,55]];
   return {type:'num', q: '<div class="flex justify-center mb-1">'+polySVG(pts,[a,b])+'</div><div>Tính độ dài đường gấp khúc ABC.</div>', ans:a+b, unit:'cm'};
 }},
 {name:'Xem đồng hồ', make:function(){
   var h=rnd(1,12), m=pick([0,0,15,30,30,45]);
   var correct=readTime(h,m); var opts=[correct];
   var guard=0; while(opts.length<4 && guard<50){ guard++; var hh=rnd(1,12), mm=pick([0,15,30,45]); var t=readTime(hh,mm); if(opts.indexOf(t)<0) opts.push(t); }
   shuffle(opts);
   return {type:'mcq', q:'<div class="flex justify-center mb-2">'+clockSVG(h,m)+'</div><div>Đồng hồ chỉ mấy giờ?</div>', choices:opts, correct:opts.indexOf(correct)};
 }},
 {name:'Cân & Đo', make:function(){
   if(Math.random()<0.5){ var a=rnd(2,15), b=rnd(2,15);
     var fig='<div class="flex justify-center gap-4 mb-2"><div class="bg-white border-2 border-emerald-100 rounded-xl px-4 py-2"><div class="text-4xl">🛢️</div><div class="text-emerald-600 font-extrabold">'+a+' l</div></div><div class="bg-white border-2 border-emerald-100 rounded-xl px-4 py-2"><div class="text-4xl">🛢️</div><div class="text-emerald-600 font-extrabold">'+b+' l</div></div></div>';
     return {type:'num', q: fig+'<div>Can thứ nhất chứa '+a+' l, can thứ hai chứa '+b+' l. Cả hai can có bao nhiêu lít dầu?</div>', ans:a+b, unit:'l'}; }
   var a=rnd(3,25), b=rnd(3,25);
   var fig='<div class="flex justify-center gap-4 mb-2"><div class="bg-white border-2 border-emerald-100 rounded-xl px-4 py-2"><div class="text-4xl">🍚</div><div class="text-emerald-600 font-extrabold">'+a+' kg</div></div><div class="bg-white border-2 border-emerald-100 rounded-xl px-4 py-2"><div class="text-4xl">🍚</div><div class="text-emerald-600 font-extrabold">'+b+' kg</div></div></div>';
   return {type:'num', q: fig+'<div>Bao gạo thứ nhất nặng '+a+' kg, bao thứ hai nặng '+b+' kg. Cả hai bao nặng bao nhiêu ki-lô-gam?</div>', ans:a+b, unit:'kg'};
 }},
 {name:'Ngày & Thứ', make:function(){
   var d1=rnd(1,18), wd1=rnd(0,6), gap=rnd(2,9); var d2=d1+gap; var wd2=((wd1+gap)%7+7)%7;
   var correct=WD[wd2]; var opts=[correct]; var guard=0;
   while(opts.length<4 && guard<50){ guard++; var w=WD[rnd(0,6)]; if(opts.indexOf(w)<0) opts.push(w); }
   shuffle(opts);
   return {type:'mcq', q:'<div class="text-5xl mb-2">📅</div><div>Ngày '+d1+' tháng 10 là <b>'+WD[wd1]+'</b>. Hỏi ngày '+d2+' tháng 10 là thứ mấy?</div>', choices:opts, correct:opts.indexOf(correct)};
 }}
];
function render(){
  document.getElementById('qhtml').innerHTML = cur.q;
  var area=document.getElementById('answerArea'); area.innerHTML='';
  document.getElementById('feedback').innerHTML='';
  if(cur.type==='num'){
    var box=document.createElement('div'); box.className='flex items-center justify-center gap-2 flex-wrap';
    var inp=document.createElement('input'); inp.id='ans'; inp.type='number'; inp.setAttribute('inputmode','numeric');
    inp.className='w-36 text-center text-2xl font-extrabold border-2 border-emerald-300 rounded-xl py-2 focus:outline-none focus:border-emerald-500';
    inp.onkeydown=function(e){ if(e.key==='Enter') checkNum(); };
    box.appendChild(inp);
    if(cur.unit){ var u=document.createElement('span'); u.className='text-lg text-slate-500 font-semibold'; u.innerText=cur.unit; box.appendChild(u); }
    area.appendChild(box);
    var btn=document.createElement('button'); btn.innerHTML='Kiểm tra đáp án ✅';
    btn.className='mt-4 px-6 py-3 bg-emerald-500 hover:bg-emerald-600 text-white font-bold rounded-full btn-press shadow';
    btn.onclick=checkNum; area.appendChild(btn);
    setTimeout(function(){ try{inp.focus();}catch(e){} },40);
  } else {
    var grid=document.createElement('div'); grid.className='grid grid-cols-2 gap-3 max-w-md mx-auto';
    cur.choices.forEach(function(ch,i){
      var b=document.createElement('button'); b.innerHTML=ch;
      b.className='px-4 py-3 bg-white border-2 border-emerald-200 rounded-xl font-extrabold text-base md:text-lg btn-press hover:bg-emerald-50';
      b.onclick=function(){ checkMCQ(i,b); }; grid.appendChild(b);
    });
    area.appendChild(grid);
  }
}
function checkNum(){ var inp=document.getElementById('ans'); if(!inp||inp.value==='') return; if(parseInt(inp.value,10)===cur.ans) good(); else bad('Chưa đúng, bé thử lại nhé! 🤔'); }
function checkMCQ(i,b){ if(i===cur.correct){ b.classList.add('bg-emerald-100','border-emerald-400'); good(); } else { b.classList.add('bg-rose-100','border-rose-400'); bad('Chưa đúng rồi! 🤔'); } }
function good(){ score+=10; streak++; upd(); try{ confetti({particleCount:60,spread:70,origin:{y:.6}}); }catch(e){} document.getElementById('feedback').innerHTML='<span class="text-emerald-600">Chính xác! 🎉 (+10 ⭐)</span>'; setTimeout(nextQ, 1100); }
function bad(msg){ streak=0; upd(); var c=document.getElementById('card'); c.classList.remove('shake'); void c.offsetWidth; c.classList.add('shake'); document.getElementById('feedback').innerHTML='<span class="text-rose-500">'+msg+'</span>'; }
function nextQ(){ cur=TOPICS[topic].make(); render(); var c=document.getElementById('card'); c.classList.remove('pop'); void c.offsetWidth; c.classList.add('pop'); }
function setTopic(i){ topic=i; buildTabs(); nextQ(); }
function buildTabs(){ var t=document.getElementById('tabs'); t.innerHTML=''; TOPICS.forEach(function(tp,i){ var b=document.createElement('button'); b.innerText=tp.name; b.className='flex-1 py-2.5 px-2 text-xs md:text-sm font-bold border-b-4 whitespace-nowrap '+(i===topic?'text-emerald-700 bg-white border-emerald-500':'text-slate-400 bg-slate-100 border-transparent hover:bg-slate-200'); b.onclick=function(){ setTopic(i); }; t.appendChild(b); }); }
function toggleFull(){ var d=document.documentElement; if(!document.fullscreenElement){ if(d.requestFullscreen) d.requestFullscreen(); } else { if(document.exitFullscreen) document.exitFullscreen(); } }
window.addEventListener('DOMContentLoaded', function(){ buildTabs(); nextQ(); });
</script>
</body>
</html>
