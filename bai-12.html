<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bài 12: Bảng nhân 9, bảng chia 9 - Toán lớp 3</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<style>
body { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; background-color: #fff7ed; }
.btn-press:active:not(:disabled){ transform: scale(0.96); }
.shake { animation: shk .4s; }
@keyframes shk { 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
.pop { animation: pp .3s ease; }
@keyframes pp { 0%{transform:scale(.85);opacity:.4} 100%{transform:scale(1);opacity:1} }
</style>
</head>
<body class="p-3 md:p-6 min-h-screen flex flex-col">
<div class="max-w-3xl mx-auto w-full mb-3 flex justify-between items-center">
  <div class="flex gap-2">
    <a href="index.html" class="bg-white text-slate-600 px-3 py-2 rounded-xl shadow-sm border border-slate-200 hover:bg-slate-50 btn-press font-semibold text-sm">🏠 Sảnh chính</a>
    <button onclick="toggleFull()" class="bg-white text-slate-600 px-3 py-2 rounded-xl shadow-sm border border-slate-200 hover:bg-slate-50 btn-press font-semibold text-sm">🔲 Phóng to</button>
  </div>
  <div class="bg-white px-4 py-2 rounded-xl shadow-sm border border-slate-200 flex items-center gap-4 font-bold">
    <span class="text-amber-500">⭐ <span id="score">0</span></span>
    <span class="text-orange-500">🔥 <span id="streak">0</span></span>
  </div>
</div>
<div class="max-w-3xl mx-auto w-full bg-white rounded-3xl shadow-xl border border-amber-100 overflow-hidden flex-grow flex flex-col">
  <div class="bg-gradient-to-r from-amber-500 to-orange-600 text-white p-4 md:p-5 text-center">
    <h1 class="text-xl md:text-3xl font-extrabold tracking-wide">Bài 12: Bảng Nhân 9, Bảng Chia 9</h1>
    <p class="text-amber-100 text-sm md:text-base mt-1">Bé chọn một hoạt động rồi luyện tập nhé!</p>
  </div>
  <div id="tabs" class="flex flex-wrap bg-slate-100 border-b border-slate-200"></div>
  <div class="p-4 md:p-6 flex-grow flex flex-col items-center justify-center">
    <div id="secname" class="text-orange-600 font-extrabold text-sm mb-2"></div>
    <div id="card" class="w-full max-w-xl bg-amber-50 border-2 border-amber-100 rounded-2xl p-5 md:p-6 text-center pop">
      <div id="qhtml" class="text-lg md:text-xl font-bold text-slate-700 mb-4 leading-relaxed"></div>
      <div id="answerArea"></div>
      <div id="feedback" class="mt-3 font-bold" style="min-height:1.6rem"></div>
    </div>
    <button onclick="nextQ()" class="mt-4 px-5 py-2.5 bg-slate-100 text-slate-600 font-bold rounded-xl border border-slate-200 hover:bg-slate-200 btn-press text-sm">Câu khác 🔄</button>
  </div>
</div>
<script>
var score=0, streak=0, cur=null, topic=0;
function rnd(a,b){ return Math.floor(Math.random()*(b-a+1))+a; }
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; } return a; }
function upd(){ document.getElementById('score').innerText=score; document.getElementById('streak').innerText=streak; }

/* Con rồng múa (SVG gốc, generic) */
function dragon(){
  return '<svg width="122" height="66" viewBox="0 0 160 84" style="display:inline-block">'
   +'<ellipse cx="86" cy="78" rx="60" ry="4" fill="rgba(0,0,0,.1)"/>'
   +'<path d="M46 46 Q66 20 88 42 Q110 64 132 42" stroke="#16a34a" stroke-width="15" fill="none" stroke-linecap="round"/>'
   +'<path d="M46 46 Q66 20 88 42 Q110 64 132 42" stroke="#f59e0b" stroke-width="15" fill="none" stroke-linecap="round" stroke-dasharray="3 16"/>'
   +'<path d="M132 42 l14 -7 l-2 9 l10 3 l-13 6 z" fill="#22c55e"/>'
   +'<circle cx="34" cy="42" r="19" fill="#ef4444" stroke="#b91c1c" stroke-width="2"/>'
   +'<circle cx="27" cy="37" r="4" fill="#fff"/><circle cx="27" cy="37" r="1.8" fill="#1f2937"/>'
   +'<path d="M18 47 q-9 3 -14 -2" stroke="#f59e0b" stroke-width="3" fill="none" stroke-linecap="round"/>'
   +'<path d="M34 23 l4 -12 l5 12 z" fill="#f59e0b"/>'
   +'<path d="M24 24 l1 -9 l5 8 z" fill="#f59e0b"/>'
   +'</svg>';
}
/* Quả dưa hấu chở một phép tính */
function melon(expr){
  return '<div style="display:inline-block;position:relative">'
   +'<svg width="132" height="70" viewBox="0 0 132 70">'
   +'<ellipse cx="64" cy="38" rx="58" ry="27" fill="#4ade80" stroke="#16a34a" stroke-width="3"/>'
   +'<path d="M30 15 Q40 38 30 61" stroke="#15803d" stroke-width="2.5" fill="none"/>'
   +'<path d="M64 12 Q74 38 64 64" stroke="#15803d" stroke-width="2.5" fill="none"/>'
   +'<path d="M98 15 Q88 38 98 61" stroke="#15803d" stroke-width="2.5" fill="none"/>'
   +'<path d="M120 24 q9 -3 12 -10" stroke="#15803d" stroke-width="3" fill="none" stroke-linecap="round"/>'
   +'</svg>'
   +'<div style="position:absolute;left:0;top:0;width:132px;height:70px;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:1.05rem;text-shadow:0 1px 2px rgba(0,0,0,.4)">'+expr+'</div>'
   +'</div>';
}
/* Bông hoa hướng dương chở một phép tính */
function flower(expr){
  var s='<div style="display:inline-block;position:relative">'
   +'<svg width="118" height="118" viewBox="0 0 120 120">'
   +'<g fill="#facc15" stroke="#eab308" stroke-width="1.5">';
  for(var i=0;i<12;i++){ var a=i*30; var r=a*Math.PI/180; var x=60+34*Math.cos(r), y=60+34*Math.sin(r);
    s+='<ellipse cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" rx="9" ry="17" transform="rotate('+a+' '+x.toFixed(1)+' '+y.toFixed(1)+')"/>'; }
  s+='</g><circle cx="60" cy="60" r="26" fill="#b45309"/>'
   +'</svg>'
   +'<div style="position:absolute;left:0;top:0;width:118px;height:118px;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:1.05rem;text-shadow:0 1px 2px rgba(0,0,0,.5)">'+expr+'</div>'
   +'</div>';
  return s;
}
/* Sơ đồ hai bước: [a] →op1→ (?) →op2→ [?] */
function arrow2(a, op1, op2){
  return '<div class="flex items-center justify-center gap-1 md:gap-2 my-3 flex-wrap">'
   +'<span style="width:52px;height:52px" class="inline-flex items-center justify-center rounded-lg bg-emerald-400 text-white font-extrabold text-xl">'+a+'</span>'
   +'<span class="text-slate-500 font-bold text-sm">'+op1+' →</span>'
   +'<span style="width:52px;height:52px" class="inline-flex items-center justify-center rounded-full bg-slate-100 border border-slate-300 text-slate-400 font-extrabold text-lg">?</span>'
   +'<span class="text-slate-500 font-bold text-sm">'+op2+' →</span>'
   +'<span style="width:52px;height:52px" class="inline-flex items-center justify-center rounded-xl bg-white border-2 border-amber-400 text-amber-600 font-extrabold text-xl">?</span>'
   +'</div>';
}
/* các phép tính và giá trị (dùng cho tab Cùng kết quả) */
var MAP={'9 × 1':9,'9 × 2':18,'9 × 3':27,'9 × 4':36,'9 × 5':45,'9 × 6':54,
 '45 : 9':5,'54 : 9':6,'18 : 9':2,'27 : 9':3,'90 : 9':10,'81 : 9':9,
 '2 × 3':6,'3 × 6':18,'18 : 2':9,'20 : 4':5,'4 × 5':20,'6 × 6':36,'2 × 5':10,'5 × 5':25};

var TOPICS = [
 {name:'Khám phá', sec:'Khám phá — Phép nhân 9 từ phép cộng', make:function(){
   var n=rnd(2,4); var dr=''; for(var i=0;i<n;i++) dr+=dragon();
   var add=[]; for(var i=0;i<n;i++) add.push('9');
   return {type:'num', q:'<div class="flex justify-center gap-1 mb-2 flex-wrap">'+dr+'</div>'
     +'<div class="text-slate-600 text-base mb-2">Mỗi đội múa rồng có 9 người. Có '+n+' đội múa rồng như thế.</div>'
     +'<div class="text-xl">'+add.join(' + ')+' = ?</div>'
     +'<div class="text-slate-500 text-base mt-1">(tức là 9 × '+n+')</div>', ans:9*n, unit:'người'};
 }},
 {name:'Lập bảng', sec:'Khám phá — Hoàn thành bảng nhân 9, bảng chia 9', make:function(){
   var k=rnd(2,10);
   if(Math.random()<0.5){
     var rows='<div class="text-center text-orange-600 font-extrabold mb-1">Bảng nhân 9</div>';
     for(var i=1;i<=10;i++){ rows+='<div class="'+(i===k?'bg-amber-200 rounded font-extrabold':'')+'">9 × '+i+' = '+(i===k?'<span class="text-amber-700">?</span>':(9*i))+'</div>'; }
     var tbl='<div style="display:inline-block;text-align:left"><div style="border:2px solid #fcd34d;border-radius:12px;background:#fff;padding:8px 18px;font-weight:700;line-height:1.5">'+rows+'</div></div>';
     return {type:'num', q: tbl+'<div class="mt-2">Số còn thiếu ở <b class="text-amber-600">9 × '+k+'</b> là bao nhiêu?</div>', ans:9*k};
   } else {
     var rows2='<div class="text-center text-sky-600 font-extrabold mb-1">Bảng chia 9</div>';
     for(var i=1;i<=10;i++){ rows2+='<div class="'+(i===k?'bg-sky-100 rounded font-extrabold':'')+'">'+(9*i)+' : 9 = '+(i===k?'<span class="text-sky-700">?</span>':i)+'</div>'; }
     var tbl2='<div style="display:inline-block;text-align:left"><div style="border:2px solid #7dd3fc;border-radius:12px;background:#fff;padding:8px 18px;font-weight:700;line-height:1.5">'+rows2+'</div></div>';
     return {type:'num', q: tbl2+'<div class="mt-2">Số còn thiếu ở <b class="text-sky-600">'+(9*k)+' : 9</b> là bao nhiêu?</div>', ans:k};
   }
 }},
 {name:'Tính nhẩm', sec:'Hoạt động 1 — Tính nhẩm', make:function(){
   var r=Math.random();
   if(r<0.55){ var k=rnd(0,10); return {type:'num', q:'<div class="text-slate-500 mb-1">Tính nhẩm</div><div class="text-4xl font-extrabold text-orange-600">9 × '+k+' = ?</div>', ans:9*k}; }
   if(r<0.8){ var k=rnd(0,10); return {type:'num', q:'<div class="text-slate-500 mb-1">Tính nhẩm</div><div class="text-4xl font-extrabold text-orange-600">'+k+' × 9 = ?</div>', ans:9*k}; }
   var k=rnd(2,10); return {type:'num', q:'<div class="text-slate-500 mb-1">Tính nhẩm</div><div class="text-4xl font-extrabold text-sky-600">'+(9*k)+' : 9 = ?</div>', ans:k};
 }},
 {name:'Cùng kết quả', sec:'Hoạt động 2 — Hai phép tính cùng kết quả', make:function(){
   var groups=[
     {v:9, ex:['9 × 1','81 : 9','18 : 2']},
     {v:18, ex:['9 × 2','3 × 6']},
     {v:5, ex:['45 : 9','20 : 4']},
     {v:6, ex:['54 : 9','2 × 3']},
     {v:36, ex:['9 × 4','6 × 6']},
     {v:10, ex:['90 : 9','2 × 5']}
   ];
   var g=pick(groups);
   var ex=shuffle(g.ex.slice()); var target=ex[0], partner=ex[1];
   var keys=Object.keys(MAP).filter(function(k){ return MAP[k]!==g.v && k!==target && k!==partner; });
   shuffle(keys);
   var ds=[], usedVals=[g.v]; var gi=0;
   while(ds.length<2 && gi<keys.length){ var kk=keys[gi++]; if(usedVals.indexOf(MAP[kk])<0){ ds.push(kk); usedVals.push(MAP[kk]); } }
   var choices=shuffle([partner].concat(ds));
   return {type:'mcq', figFn:melon,
     q:'<div class="mb-1">Phép tính nào có cùng kết quả với</div><div class="flex justify-center my-2">'+melon(target)+'</div>',
     choices:choices, correct:choices.indexOf(partner)};
 }},
 {name:'Số còn thiếu', sec:'Luyện tập — Nêu các số còn thiếu', make:function(){
   var up=Math.random()<0.5; var seq=[]; for(var i=1;i<=9;i++) seq.push(9*i); if(!up) seq.reverse();
   var hi=rnd(1,7); var ans=seq[hi];
   var chips='<div class="flex flex-wrap justify-center items-center gap-2 mb-3">';
   for(var i=0;i<seq.length;i++){
     if(up){ chips+= (i===hi)
        ? '<span style="width:46px;height:46px" class="inline-flex items-center justify-center rounded-lg bg-white border-2 border-emerald-400 text-emerald-600 font-extrabold text-xl">?</span>'
        : '<span style="width:46px;height:46px" class="inline-flex items-center justify-center rounded-lg bg-emerald-400 text-white font-extrabold text-base">'+seq[i]+'</span>';
     } else { chips+= (i===hi)
        ? '<span style="width:46px;height:46px" class="inline-flex items-center justify-center rounded-md bg-white border-2 border-amber-400 text-amber-600 font-extrabold text-xl">?</span>'
        : '<span style="width:46px;height:46px" class="inline-flex items-center justify-center rounded-md bg-amber-400 text-white font-extrabold text-base">'+seq[i]+'</span>';
     }
   }
   chips+='</div>';
   return {type:'num', q: chips+'<div>Dãy số đếm '+(up?'thêm':'bớt')+' 9. Số còn thiếu ở ô <b class="'+(up?'text-emerald-600':'text-amber-600')+'">?</b> là bao nhiêu?</div>', ans:ans};
 }},
 {name:'Sơ đồ', sec:'Luyện tập — Số?', make:function(){
   var p=rnd(2,6); var mid=9*p;
   var divs=[]; for(var q=2;q<=9;q++){ if(mid%q===0) divs.push(q); }
   var qd=pick(divs);
   return {type:'num', q: arrow2(9, '× '+p, ': '+qd)+'<div>Số ở ô cuối cùng là bao nhiêu?</div>', ans: mid/qd};
 }},
 {name:'So với 10', sec:'Luyện tập — Kết quả lớn hơn hay bé hơn 10?', make:function(){
   var pool=['9 × 2','9 × 3','9 × 4','9 × 5','9 × 6','9 × 1','54 : 9','45 : 9','18 : 9','27 : 9','81 : 9','36 : 9','63 : 9','90 : 9','9 × 9','9 × 8'];
   var e=pick(pool); var v; var parts;
   if(e.indexOf('×')>=0){ parts=e.split(' × '); v=parseInt(parts[0],10)*parseInt(parts[1],10); }
   else { parts=e.split(' : '); v=parseInt(parts[0],10)/parseInt(parts[1],10); }
   var correct = v>10 ? 0 : (v<10 ? 1 : 2);
   return {type:'mcq',
     q:'<div class="mb-1">Kết quả của phép tính trên bông hoa so với <b>10</b> thế nào?</div><div class="flex justify-center my-2">'+flower(e)+'</div>',
     choices:['Lớn hơn 10','Bé hơn 10','Bằng 10'], correct:correct};
 }},
 {name:'Giải toán', sec:'Luyện tập — Giải toán', make:function(){
   var r=Math.random(); var n=rnd(2,9);
   if(r<0.34) return {type:'num', q:'<div class="text-5xl mb-2">⛵</div>Trên mỗi thuyền có 9 người. Hỏi '+n+' thuyền như thế có bao nhiêu người?', ans:9*n, unit:'người'};
   if(r<0.68) return {type:'num', q:'<div class="text-5xl mb-2">🍊</div>Mỗi túi có 9 quả cam. Hỏi '+n+' túi như thế có bao nhiêu quả cam?', ans:9*n, unit:'quả'};
   return {type:'num', q:'<div class="text-5xl mb-2">🫙</div>Chia đều '+(9*n)+' l nước mắm vào 9 cái can. Hỏi mỗi can có bao nhiêu lít nước mắm?', ans:n, unit:'lít'};
 }}
];
function render(){
  document.getElementById('secname').innerText = TOPICS[topic].sec || '';
  document.getElementById('qhtml').innerHTML = cur.q;
  var area=document.getElementById('answerArea'); area.innerHTML='';
  document.getElementById('feedback').innerHTML='';
  if(cur.type==='num'){
    var box=document.createElement('div'); box.className='flex items-center justify-center gap-2 flex-wrap';
    var inp=document.createElement('input'); inp.id='ans'; inp.type='number'; inp.setAttribute('inputmode','numeric');
    inp.className='w-36 text-center text-2xl font-extrabold border-2 border-amber-300 rounded-xl py-2 focus:outline-none focus:border-amber-500';
    inp.onkeydown=function(e){ if(e.key==='Enter') checkNum(); };
    box.appendChild(inp);
    if(cur.unit){ var u=document.createElement('span'); u.className='text-lg text-slate-500 font-semibold'; u.innerText=cur.unit; box.appendChild(u); }
    area.appendChild(box);
    var btn=document.createElement('button'); btn.innerHTML='Kiểm tra đáp án ✅';
    btn.className='mt-4 px-6 py-3 bg-amber-500 hover:bg-amber-600 text-white font-bold rounded-full btn-press shadow';
    btn.onclick=checkNum; area.appendChild(btn);
    setTimeout(function(){ try{inp.focus();}catch(e){} },40);
  } else {
    var grid=document.createElement('div'); grid.className='grid grid-cols-2 gap-3 max-w-lg mx-auto';
    cur.choices.forEach(function(ch,i){
      var b=document.createElement('button');
      b.innerHTML = cur.figFn ? cur.figFn(ch) : ch;
      b.className='px-2 py-3 bg-white border-2 border-amber-200 rounded-xl font-extrabold text-lg btn-press hover:bg-amber-50 flex items-center justify-center';
      b.onclick=function(){ checkMCQ(i,b); }; grid.appendChild(b);
    });
    area.appendChild(grid);
  }
}
function checkNum(){ var inp=document.getElementById('ans'); if(!inp||inp.value==='') return; if(parseInt(inp.value,10)===cur.ans) good(); else bad('Chưa đúng, bé thử lại nhé! 🤔'); }
function checkMCQ(i,b){ if(i===cur.correct){ b.classList.add('bg-emerald-100','border-emerald-400'); good(); } else { b.classList.add('bg-rose-100','border-rose-400'); bad('Chưa đúng rồi! 🤔'); } }
function good(){ score+=10; streak++; upd(); try{ confetti({particleCount:60,spread:70,origin:{y:.6}}); }catch(e){} document.getElementById('feedback').innerHTML='<span class="text-emerald-600">Chính xác! 🎉 (+10 ⭐)</span>'; setTimeout(nextQ, 1100); }
function bad(msg){ streak=0; upd(); var c=document.getElementById('card'); c.classList.remove('shake'); void c.offsetWidth; c.classList.add('shake'); document.getElementById('feedback').innerHTML='<span class="text-rose-500">'+msg+'</span>'; }
function nextQ(){ cur=TOPICS[topic].make(); render(); var c=document.getElementById('card'); c.classList.remove('pop'); void c.offsetWidth; c.classList.add('pop'); }
function setTopic(i){ topic=i; buildTabs(); nextQ(); }
function buildTabs(){ var t=document.getElementById('tabs'); t.innerHTML=''; TOPICS.forEach(function(tp,i){ var b=document.createElement('button'); b.innerText=tp.name; b.className='flex-1 basis-1/3 py-2.5 px-2 text-xs md:text-sm font-bold border-b-4 whitespace-nowrap '+(i===topic?'text-orange-700 bg-white border-orange-500':'text-slate-400 bg-slate-100 border-transparent hover:bg-slate-200'); b.onclick=function(){ setTopic(i); }; t.appendChild(b); }); }
function toggleFull(){ var d=document.documentElement; if(!document.fullscreenElement){ if(d.requestFullscreen) d.requestFullscreen(); } else { if(document.exitFullscreen) document.exitFullscreen(); } }
window.addEventListener('DOMContentLoaded', function(){ buildTabs(); nextQ(); });
</script>
</body>
</html>
