<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bài 10: Bảng nhân 7, bảng chia 7 - Toán lớp 3</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<style>
body { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; background-color: #fff7ed; }
.btn-press:active:not(:disabled){ transform: scale(0.96); }
.shake { animation: shk .4s; }
@keyframes shk { 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
.pop { animation: pp .3s ease; }
@keyframes pp { 0%{transform:scale(.85);opacity:.4} 100%{transform:scale(1);opacity:1} }
</style>
</head>
<body class="p-3 md:p-6 min-h-screen flex flex-col">
<div class="max-w-3xl mx-auto w-full mb-3 flex justify-between items-center">
  <div class="flex gap-2">
    <a href="index.html" class="bg-white text-slate-600 px-3 py-2 rounded-xl shadow-sm border border-slate-200 hover:bg-slate-50 btn-press font-semibold text-sm">🏠 Sảnh chính</a>
    <button onclick="toggleFull()" class="bg-white text-slate-600 px-3 py-2 rounded-xl shadow-sm border border-slate-200 hover:bg-slate-50 btn-press font-semibold text-sm">🔲 Phóng to</button>
  </div>
  <div class="bg-white px-4 py-2 rounded-xl shadow-sm border border-slate-200 flex items-center gap-4 font-bold">
    <span class="text-amber-500">⭐ <span id="score">0</span></span>
    <span class="text-orange-500">🔥 <span id="streak">0</span></span>
  </div>
</div>
<div class="max-w-3xl mx-auto w-full bg-white rounded-3xl shadow-xl border border-amber-100 overflow-hidden flex-grow flex flex-col">
  <div class="bg-gradient-to-r from-amber-500 to-orange-600 text-white p-4 md:p-5 text-center">
    <h1 class="text-xl md:text-3xl font-extrabold tracking-wide">Bài 10: Bảng Nhân 7, Bảng Chia 7</h1>
    <p class="text-amber-100 text-sm md:text-base mt-1">Bé chọn một hoạt động rồi luyện tập nhé!</p>
  </div>
  <div id="tabs" class="flex flex-wrap bg-slate-100 border-b border-slate-200"></div>
  <div class="p-4 md:p-6 flex-grow flex flex-col items-center justify-center">
    <div id="secname" class="text-orange-600 font-extrabold text-sm mb-2"></div>
    <div id="card" class="w-full max-w-xl bg-amber-50 border-2 border-amber-100 rounded-2xl p-5 md:p-6 text-center pop">
      <div id="qhtml" class="text-lg md:text-xl font-bold text-slate-700 mb-4 leading-relaxed"></div>
      <div id="answerArea"></div>
      <div id="feedback" class="mt-3 font-bold" style="min-height:1.6rem"></div>
    </div>
    <button onclick="nextQ()" class="mt-4 px-5 py-2.5 bg-slate-100 text-slate-600 font-bold rounded-xl border border-slate-200 hover:bg-slate-200 btn-press text-sm">Câu khác 🔄</button>
  </div>
</div>
<script>
var score=0, streak=0, cur=null, topic=0;
function rnd(a,b){ return Math.floor(Math.random()*(b-a+1))+a; }
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; } return a; }
function upd(){ document.getElementById('score').innerText=score; document.getElementById('streak').innerText=streak; }
function kids(rows){ var s='<div class="mb-2">'; for(var r=0;r<rows;r++){ s+='<div style="font-size:1.5rem;line-height:1.25">'+'🧒'.repeat(7)+'</div>'; } s+='</div>'; return s; }
function arrowBox(inp, op){
  return '<div class="flex items-center justify-center gap-2 my-3 flex-wrap">'
   +'<span style="width:60px;height:60px" class="inline-flex items-center justify-center rounded-full bg-amber-400 text-white font-extrabold text-2xl">'+inp+'</span>'
   +'<span class="text-slate-500 font-extrabold text-lg">'+op+' →</span>'
   +'<span style="width:60px;height:60px" class="inline-flex items-center justify-center rounded-xl bg-white border-2 border-amber-400 text-amber-600 font-extrabold text-2xl">?</span>'
   +'</div>';
}
function ball(expr){
  return '<div style="display:inline-block;position:relative;width:86px;height:86px">'
   +'<svg width="86" height="86" viewBox="0 0 86 86">'
   +'<circle cx="43" cy="43" r="40" fill="#fde68a" stroke="#f59e0b" stroke-width="2"/>'
   +'<path d="M43 3 A40 40 0 0 1 83 43 L43 43 Z" fill="#93c5fd"/>'
   +'<path d="M43 83 A40 40 0 0 1 3 43 L43 43 Z" fill="#86efac"/>'
   +'<circle cx="43" cy="43" r="40" fill="none" stroke="#f59e0b" stroke-width="2"/>'
   +'<circle cx="43" cy="43" r="15" fill="#fff" opacity="0.85"/></svg>'
   +'<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800;color:#1f2937;font-size:0.95rem">'+expr+'</div></div>';
}
var TOPICS = [
 {name:'Khám phá', sec:'Khám phá — Phép nhân 7 là phép cộng các số 7', make:function(){
   var n=rnd(2,4); var add=[]; for(var i=0;i<n;i++) add.push('7');
   return {type:'num', q: kids(n)
     +'<div class="text-slate-600 text-base mb-2">Mỗi đội kéo co có 7 bạn. Có '+n+' đội chơi.</div>'
     +'<div class="text-xl">'+add.join(' + ')+' = ?</div>'
     +'<div class="text-slate-500 text-base mt-1">(tức là 7 × '+n+')</div>', ans:7*n, unit:'bạn'};
 }},
 {name:'Mũi tên', sec:'Hoạt động 1 — Số?', make:function(){
   if(Math.random()<0.5){ var k=rnd(2,10); return {type:'num', q: arrowBox(7, '× '+k)+'<div>Số ở ô <b class="text-amber-600">?</b> là bao nhiêu?</div>', ans:7*k}; }
   var k=rnd(2,10); return {type:'num', q: arrowBox(7*k, ': 7')+'<div>Số ở ô <b class="text-amber-600">?</b> là bao nhiêu?</div>', ans:k};
 }},
 {name:'Chọn bóng', sec:'Hoạt động 2 — Chọn phép tính theo điều kiện', make:function(){
   function mk(){ if(Math.random()<0.5){ var k=rnd(1,10); return {t:'7 × '+k, v:7*k}; } var k=rnd(1,10); return {t:(7*k)+' : 7', v:k}; }
   var pool=[]; while(pool.length<4){ var e=mk(); if(!pool.some(function(p){return p.v===e.v;})) pool.push(e); }
   var vals=pool.map(function(p){return p.v;}).slice().sort(function(a,b){return a-b;});
   var N=vals[1]; var correctVal=vals[0];
   var order=pool.slice(); shuffle(order);
   return {type:'mcq', figFn:ball, q:'<div>Quả bóng nào ghi phép tính có <b>kết quả bé hơn '+N+'</b>?</div>', choices:order.map(function(o){return o.t;}), correct:order.findIndex(function(o){return o.v===correctVal;})};
 }},
 {name:'Số còn thiếu', sec:'Luyện tập — Nêu các số còn thiếu', make:function(){
   var up=Math.random()<0.5; var seq=[]; for(var i=1;i<=8;i++) seq.push(7*i); if(!up) seq.reverse();
   var hi=rnd(1,6); var ans=seq[hi];
   var chips='<div class="flex flex-wrap justify-center items-center gap-2 mb-3">';
   for(var i=0;i<seq.length;i++){
     if(up){ chips+= (i===hi)
        ? '<span style="width:48px;height:48px" class="inline-flex items-center justify-center rounded-full bg-white border-2 border-amber-400 text-amber-600 font-extrabold text-xl">?</span>'
        : '<span style="width:48px;height:48px" class="inline-flex items-center justify-center rounded-full bg-amber-400 text-white font-extrabold text-base">'+seq[i]+'</span>';
     } else { chips+= (i===hi)
        ? '<span style="width:44px;height:44px;transform:rotate(45deg)" class="inline-flex items-center justify-center bg-white border-2 border-sky-400 text-sky-600 font-extrabold"><span style="transform:rotate(-45deg)">?</span></span>'
        : '<span style="width:44px;height:44px;transform:rotate(45deg)" class="inline-flex items-center justify-center bg-sky-400 text-white font-extrabold"><span style="transform:rotate(-45deg);font-size:.9rem">'+seq[i]+'</span></span>';
     }
   }
   chips+='</div>';
   return {type:'num', q: chips+'<div>Dãy số đếm '+(up?'thêm':'bớt')+' 7. Số còn thiếu ở ô <b class="'+(up?'text-amber-600':'text-sky-600')+'">?</b> là bao nhiêu?</div>', ans:ans};
 }},
 {name:'Lập bảng', sec:'Khám phá — Hoàn thành bảng nhân 7', make:function(){
   var k=rnd(2,10);
   var rows='<div class="text-center text-orange-600 font-extrabold mb-1">Bảng nhân 7</div>';
   for(var i=1;i<=10;i++){ rows+='<div class="'+(i===k?'bg-amber-200 rounded font-extrabold':'')+'">7 × '+i+' = '+(i===k?'<span class="text-amber-700">?</span>':(7*i))+'</div>'; }
   var tbl='<div style="display:inline-block;text-align:left"><div style="border:2px solid #fcd34d;border-radius:12px;background:#fff;padding:8px 18px;font-weight:700;line-height:1.5">'+rows+'</div></div>';
   return {type:'num', q: tbl+'<div class="mt-2">Số còn thiếu ở <b class="text-amber-600">7 × '+k+'</b> là bao nhiêu?</div>', ans:7*k};
 }},
 {name:'So sánh', sec:'Luyện tập — So sánh (>, <, =)', make:function(){
   function mk(){ var r=rnd(1,3); if(r===1){ var k=rnd(1,10); return {t:'7 × '+k, v:7*k}; } if(r===2){ var k=rnd(1,10); return {t:(7*k)+' : 7', v:k}; } var k=rnd(1,10); return {t:k+' × 7', v:7*k}; }
   var A=mk(), B=mk();
   if(Math.random()<0.3){ var k=rnd(2,10); A={t:'7 × '+k, v:7*k}; B={t:k+' × 7', v:7*k}; }
   var correct = A.v>B.v ? '>' : (A.v<B.v ? '<' : '=');
   return {type:'mcq', q:'<div class="text-2xl font-extrabold text-orange-600 my-2">'+A.t+' &nbsp; ? &nbsp; '+B.t+'</div><div>Điền dấu thích hợp:</div>', choices:['>','<','='], correct:['>','<','='].indexOf(correct)};
 }},
 {name:'Giải toán', sec:'Luyện tập — Giải toán', make:function(){
   var n=rnd(2,9);
   if(Math.random()<0.5) return {type:'num', q:'<div class="text-5xl mb-2">📅</div>Mỗi tuần lễ có 7 ngày. Bố của Mai đi công tác '+n+' tuần lễ. Hỏi bố của Mai đi công tác bao nhiêu ngày?', ans:7*n, unit:'ngày'};
   var tot=7*n; return {type:'num', q:'<div class="text-5xl mb-2">🥤</div>Có '+tot+' cái cốc xếp đều vào 7 hộp. Hỏi mỗi hộp có mấy cái cốc?', ans:n, unit:'cái'};
 }}
];
function render(){
  document.getElementById('secname').innerText = TOPICS[topic].sec || '';
  document.getElementById('qhtml').innerHTML = cur.q;
  var area=document.getElementById('answerArea'); area.innerHTML='';
  document.getElementById('feedback').innerHTML='';
  if(cur.type==='num'){
    var box=document.createElement('div'); box.className='flex items-center justify-center gap-2 flex-wrap';
    var inp=document.createElement('input'); inp.id='ans'; inp.type='number'; inp.setAttribute('inputmode','numeric');
    inp.className='w-36 text-center text-2xl font-extrabold border-2 border-amber-300 rounded-xl py-2 focus:outline-none focus:border-amber-500';
    inp.onkeydown=function(e){ if(e.key==='Enter') checkNum(); };
    box.appendChild(inp);
    if(cur.unit){ var u=document.createElement('span'); u.className='text-lg text-slate-500 font-semibold'; u.innerText=cur.unit; box.appendChild(u); }
    area.appendChild(box);
    var btn=document.createElement('button'); btn.innerHTML='Kiểm tra đáp án ✅';
    btn.className='mt-4 px-6 py-3 bg-amber-500 hover:bg-amber-600 text-white font-bold rounded-full btn-press shadow';
    btn.onclick=checkNum; area.appendChild(btn);
    setTimeout(function(){ try{inp.focus();}catch(e){} },40);
  } else {
    var grid=document.createElement('div'); grid.className='grid grid-cols-2 gap-3 max-w-lg mx-auto';
    cur.choices.forEach(function(ch,i){
      var b=document.createElement('button');
      b.innerHTML = cur.figFn ? cur.figFn(ch) : ch;
      b.className='px-2 py-2 bg-white border-2 border-amber-200 rounded-xl font-extrabold text-lg btn-press hover:bg-amber-50 flex items-center justify-center';
      b.onclick=function(){ checkMCQ(i,b); }; grid.appendChild(b);
    });
    area.appendChild(grid);
  }
}
function checkNum(){ var inp=document.getElementById('ans'); if(!inp||inp.value==='') return; if(parseInt(inp.value,10)===cur.ans) good(); else bad('Chưa đúng, bé thử lại nhé! 🤔'); }
function checkMCQ(i,b){ if(i===cur.correct){ b.classList.add('bg-emerald-100','border-emerald-400'); good(); } else { b.classList.add('bg-rose-100','border-rose-400'); bad('Chưa đúng rồi! 🤔'); } }
function good(){ score+=10; streak++; upd(); try{ confetti({particleCount:60,spread:70,origin:{y:.6}}); }catch(e){} document.getElementById('feedback').innerHTML='<span class="text-emerald-600">Chính xác! 🎉 (+10 ⭐)</span>'; setTimeout(nextQ, 1100); }
function bad(msg){ streak=0; upd(); var c=document.getElementById('card'); c.classList.remove('shake'); void c.offsetWidth; c.classList.add('shake'); document.getElementById('feedback').innerHTML='<span class="text-rose-500">'+msg+'</span>'; }
function nextQ(){ cur=TOPICS[topic].make(); render(); var c=document.getElementById('card'); c.classList.remove('pop'); void c.offsetWidth; c.classList.add('pop'); }
function setTopic(i){ topic=i; buildTabs(); nextQ(); }
function buildTabs(){ var t=document.getElementById('tabs'); t.innerHTML=''; TOPICS.forEach(function(tp,i){ var b=document.createElement('button'); b.innerText=tp.name; b.className='flex-1 basis-1/3 py-2.5 px-2 text-xs md:text-sm font-bold border-b-4 whitespace-nowrap '+(i===topic?'text-orange-700 bg-white border-orange-500':'text-slate-400 bg-slate-100 border-transparent hover:bg-slate-200'); b.onclick=function(){ setTopic(i); }; t.appendChild(b); }); }
function toggleFull(){ var d=document.documentElement; if(!document.fullscreenElement){ if(d.requestFullscreen) d.requestFullscreen(); } else { if(document.exitFullscreen) document.exitFullscreen(); } }
window.addEventListener('DOMContentLoaded', function(){ buildTabs(); nextQ(); });
</script>
</body>
</html>
